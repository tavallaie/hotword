[project]
name = "hotword"
version = "0.0.0"
description = "Wakeword detection with interchangeable VAD and speech models"
readme = "README.md"
authors = [
    { name = "Ali Tavallaie", email = "a.tavallaie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cactus-needle>=3.1.3,<4",
    "numpy>=2.5.3",
    "onnxruntime>=1.23,<2",
    "sounddevice>=0.5.6",
]

[project.scripts]
hotword = "hotword.cli:main"

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
